# One origin for everything, so a guest's phone only needs the café's address:
#   /api, /admin → Django   /media, /static → shared volumes   the rest → the SPA
server {
    listen 80;
    client_max_body_size 10m;  # cat photos

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /media/  { alias /srv/media/; }
    location /static/ { alias /srv/static/; }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
