# Whisker & Brew — the whole café on one machine.
#   docker compose up --build    then open http://<this machine's LAN IP>:8080
# Settings come from .env (copy .env.example). PUBLIC_BASE_URL must be the
# address phones use, e.g. http://192.168.1.20:8080.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cat_cafe
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cafe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d cat_cafe"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://cafe:${POSTGRES_PASSWORD:-cafe}@db:5432/cat_cafe
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
      CELERY_ENABLED: "true"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://cafe:${POSTGRES_PASSWORD:-cafe}@db:5432/cat_cafe
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
      CELERY_ENABLED: "true"
    volumes:
      - media:/app/media
    depends_on: [web]

  beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://cafe:${POSTGRES_PASSWORD:-cafe}@db:5432/cat_cafe
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on: [web]

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on: [web]

volumes:
  pgdata:
  media:
  static:
